name: Publish Board Member Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/publish-board-member-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt

      - name: Build directly under /board-members/
        run: |
          rm -rf _pages
          mkdir -p _pages/board-members
          mkdocs build --clean --strict --site-dir _pages/board-members

      - name: Create documentation landing page
        run: |
          touch _pages/.nojekyll

          cat > _pages/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>schoolboard.net Documentation</title>
            <style>
              body { font: 18px/1.5 system-ui, sans-serif; margin: 0; color: #173b27; }
              main { max-width: 760px; margin: 12vh auto; padding: 0 24px; }
              a { color: #176b3a; }
            </style>
          </head>
          <body>
            <main>
              <h1>schoolboard.net Documentation</h1>
              <p><a href="./board-members/">Board Member Documentation</a></p>
            </main>
          </body>
          </html>
          EOF

      - name: Verify staged Board Member site
        run: |
          test -f _pages/board-members/index.html
          test -n "$(find _pages/board-members/assets/stylesheets -name 'main*.css' -print -quit)"
          test -n "$(find _pages/board-members/assets/javascripts -name 'bundle*.js' -print -quit)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
