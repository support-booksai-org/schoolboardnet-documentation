site_name: Accordion Agenda Guide
site_description: Shared workflow guide for schoolboard.net Accordion Agendas
site_author: schoolboard.net
site_url: https://docs.schoolboard.net/accordion-agenda/
docs_dir: docs-accordion-agenda
site_dir: site-accordion-agenda
use_directory_urls: true
strict: true

theme:
  name: material
  locale: en
  font: false
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Quick Start: index.md
  - Conventions used in this guide: conventions.md
  - Work safely in Draft Mode: draft-mode.md
  - Templates and cloning: templates-cloning.md
  - Anatomy of an Accordion Agenda: anatomy.md
  - Build and edit an agenda:
      - Overview: building-editing.md
      - Edit after cloning: edit-after-cloning.md
      - Accordion Sections and Agenda Items: sections-agenda-items.md
      - Expandable HTML and section controls: expandable-html-controls.md
  - Attachments:
      - Overview: attachments.md
      - Add and organize attachments: attachments-add-organize.md
      - Replace attachments or change access: attachments-replace-access.md
  - Publish and revise:
      - Overview: publishing-notifications.md
      - Publish and verify: publish-verify.md
      - Notifications and revisions: notifications-revisions-guide.md
  - Best Practices and Final Checklist: best-practices.md
  - Troubleshooting:
      - Overview and getting help: troubleshooting.md
      - Find content and resolve access: troubleshooting-find-access.md
      - Attachment problems: troubleshooting-attachments.md
      - Notifications and revisions: troubleshooting-notifications.md
  - Quick References:
      - Accordion Agenda Quick Start: quick-reference.md
      - Final Publication Checklist: publication-checklist.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-3

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

copyright: schoolboard.net Accordion Agenda Guide — Version 1.1.003 Review Edition
