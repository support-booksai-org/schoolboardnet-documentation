site_name: Accordion Agenda Guide
site_description: Shared workflow guide for schoolboard.net Accordion Agendas
site_author: schoolboard.net
site_url: https://docs.schoolboard.net/accordion-agenda/
docs_dir: docs-accordion-agenda
site_dir: site-accordion-agenda
use_directory_urls: true
strict: true

theme:
  name: material
  locale: en
  font: false
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Quick Start: index.md
  - Conventions used in this guide: conventions.md
  - Work safely in Draft Mode: draft-mode.md
  - Templates and cloning: templates-cloning.md
  - Anatomy of an Accordion Agenda: anatomy.md
  - Building and editing an agenda: building-editing.md
  - Public and private attachments: attachments.md
  - Publishing, notifications, and revisions: publishing-notifications.md
  - Best Practices and Final Checklist: best-practices.md
  - Troubleshooting and Getting Help: troubleshooting.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-3

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

copyright: schoolboard.net Accordion Agenda Guide — Version 1.1.003 Review Edition
