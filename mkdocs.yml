site_name: schoolboard.net Board Member Help
site_description: Task-focused online help for schoolboard.net Board Members
site_author: schoolboard.net
site_url: https://docs.schoolboard.net/board-members/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  locale: en
  font: false
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Quick Start: index.md
  - Sign in and accounts: sign-in.md
  - Find a meeting: find-a-meeting.md
  - Review an agenda: review-an-agenda.md
  - Public and private materials: materials.md
  - Search and print: search-and-print.md
  - Accessibility and help: accessibility-and-help.md
  - Meeting checklist: meeting-checklist.md
  - Reference and review notes: reference.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-3

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

copyright: schoolboard.net Board Member documentation — Version 1.0 review
