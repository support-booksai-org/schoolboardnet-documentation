site_name: schoolboard.net Documentation
site_description: Official documentation for the schoolboard.net platform.
site_author: schoolboardnet, LLC
site_url: https://docs.schoolboard.net/
repo_name: schoolboardnet-llc/schoolboardnet-docs

# MkDocs requires documentation source to live in a child folder.
docs_dir: docs
site_dir: site

copyright: Copyright &copy; schoolboardnet, LLC. All rights reserved.

theme:
  name: material
  language: en
  logo: assets/logo-placeholder.svg
  favicon: assets/favicon-placeholder.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Project:
      - Project Roadmap: project/PROJECT-ROADMAP.md
      - Master Table of Contents: project/MASTER-TABLE-OF-CONTENTS.md
      - Documentation Status: project/DOCUMENTATION-STATUS.md
  - Volume 0 — Documentation Standards:
      - Overview: documentation-standards/index.md
      - Repository Standards: documentation-standards/repository-standards.md
      - Markdown Standards: documentation-standards/markdown-standards.md
      - Metadata Standards: documentation-standards/metadata-standards.md
      - Accessibility Standards: documentation-standards/accessibility-standards.md
      - Screenshot Standards: documentation-standards/screenshot-standards.md
      - Callout Standards: documentation-standards/callout-standards.md
      - Glossary: documentation-standards/glossary.md
  - Administrator Topics:
      - Overview: administrator/index.md
      - Users:
          - Users Overview: administrator/users/index.md
          - Add User: administrator/users/add-user.md
          - Reset Password: administrator/users/reset-password.md
      - Groups: administrator/groups/index.md
      - Agendas: administrator/agendas/index.md
  - Accessibility: accessibility/index.md
  - Content Authoring: authoring/index.md
  - Knowledge Base: knowledge-base/index.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - minify:
      minify_html: true

extra:
  generator: false
