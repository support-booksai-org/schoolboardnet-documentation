site_name: Public User Guide
site_description: Task-focused online help for public visitors to schoolboard.net district sites
site_author: schoolboard.net
site_url: https://docs.schoolboard.net/public/
docs_dir: docs-public
site_dir: site-public
use_directory_urls: true
strict: true

# Preserve the former combined-topic URL for saved links without placing it
# in the current task-focused navigation.
not_in_nav: |
  notifications-accessibility.md

theme:
  name: material
  locale: en
  font: false
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Quick Start: index.md
  - Conventions used in this guide: conventions.md
  - Find a meeting: meetings.md
  - Navigation and search: navigation-search.md
  - Agendas and public materials: agendas-materials.md
  - Print an agenda: printing.md
  - Subscribe to notifications: notifications.md
  - Accessibility and help: accessibility.md
  - Reference and revision notes: reference.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-3

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

copyright: schoolboard.net Public User Guide — Version 1.1.004 Review Edition
