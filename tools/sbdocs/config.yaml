# schoolboard.net Documentation Workbench configuration
project_root: "/Volumes/Current Projects/SBN/schoolboardnet-llc/schoolboardnet-docs"
site_url: "https://demo10.schoolboard.net"
browser_app: "Dia"
snagit_app: "Snagit"
window:
  left: 0
  top: 25
  width: 1600
  height: 1200
session_dir: "docs/capture-sessions"

# Snagit model:
# One editable .snagx per feature/source screen, multiple exported PNGs.
features:
  dashboard:
    label: "Dashboard / Home"
    url: "https://demo10.schoolboard.net"
    snagx_dir: "assets/source/snagx/dashboard"
    png_dir: "assets/screenshots/dashboard"
    docs_file: "docs/dashboard/index.md"
    source_snaq: "dashboard-home.snagx"
    suggested_exports:
      - dashboard-home.png
      - dashboard-login.png
      - dashboard-search.png
      - dashboard-upcoming-events.png
      - dashboard-past-events.png
  users:
    label: "Users"
    url: "https://demo10.schoolboard.net/user/login"
    snagx_dir: "assets/source/snagx/users"
    png_dir: "assets/screenshots/users"
    docs_file: "docs/users/index.md"
    source_snaq: "users-overview.snagx"
    suggested_exports:
      - users-list.png
      - users-add.png
      - users-edit.png
      - users-reset-password.png
  groups:
