site_name: Group Administrator Guide
site_description: Task-focused online help for schoolboard.net Group Administrators
site_author: schoolboard.net
site_url: https://docs.schoolboard.net/group-admin/
docs_dir: docs-group-admin
site_dir: site-group-admin
use_directory_urls: true
strict: true

theme:
  name: material
  locale: en
  font: false
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Quick Start: index.md
  - Conventions used in this guide: conventions.md
  - Group home page: group-home.md
  - What Group Administrators can do: scope.md
  - Group Members:
      - View group members: view-members.md
      - Add a group member: add-members.md
      - Remove a group member: remove-members.md
  - Agendas:
      - Edit locks and safe editing: edit-locks.md
      - Agendas and attachments: agendas.md
      - Working with Drafts & Templates: drafts-templates.md
      - Notifications and revisions: notifications-revisions.md
  - Best Practices: best-practices.md
  - Frequently Asked Questions: faq.md
  - Safety and Troubleshooting: safety-help.md
  - Reference and Review Notes: reference.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-3

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

copyright: schoolboard.net Group Administrator Guide — Version 1.1.004 Review Edition
