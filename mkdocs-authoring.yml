site_name: Accessible Content Authoring Guide
site_description: Shared guidance for preparing accessible Word, Google Docs, HTML, PDF, and attachment content for schoolboard.net
site_author: schoolboard.net
site_url: https://docs.schoolboard.net/authoring/
docs_dir: docs-authoring
site_dir: site-authoring
use_directory_urls: true
strict: true

theme:
  name: material
  locale: en
  font: false
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Quick Start: index.md
  - Conventions used in this guide: conventions.md
  - Prepare the source document: prepare-source.md
  - Working with Microsoft Word: microsoft-word.md
  - Working with Google Docs: google-docs.md
  - Remove formatting junk: formatting-cleanup.md
  - AI-assisted HTML conversion: ai-assisted-conversion.md
  - Appendix - Google Docs and PDF to Expandable HTML: google-docs-pdf-expandable-html.md
  - Accessible content structure: accessible-structure.md
  - Convert to Expandable HTML: convert-html.md
  - PDFs and file attachments: files-pdfs.md
  - Final authoring checklist: authoring-checklist.md
  - Troubleshooting: troubleshooting.md
  - Official references: official-references.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-3

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

copyright: schoolboard.net Accessible Content Authoring Guide — Version 1.1.010 Review Edition
