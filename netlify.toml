[build]
 command = """
python -m pip install -r requirements.txt && \
rm -rf dist && \
mkdir -p \
dist/board-members \
dist/public \
dist/district-admin \
dist/group-admin \
dist/accordion-agenda && \
mkdocs build --clean --strict \
  --config-file mkdocs.yml \
  --site-dir dist/board-members && \
mkdocs build --clean --strict \
  --config-file mkdocs-public.yml \
  --site-dir dist/public && \
mkdocs build --clean --strict \
  --config-file mkdocs-district-admin.yml \
  --site-dir dist/district-admin && \
mkdocs build --clean --strict \
  --config-file mkdocs-group-admin.yml \
  --site-dir dist/group-admin && \
mkdocs build --clean --strict \
  --config-file mkdocs-accordion-agenda.yml \
  --site-dir dist/accordion-agenda && \
cp -R docs-home/. dist/
"""

[build.environment]
  PYTHON_VERSION = "3.12"
