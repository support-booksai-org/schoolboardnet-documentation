site_name: District Administrator Guide
site_description: Task-focused online help for schoolboard.net District Administrators
site_author: schoolboard.net
site_url: https://docs.schoolboard.net/district-admin/
docs_dir: docs-district-admin
site_dir: site-district-admin
use_directory_urls: true
strict: true

theme:
  name: material
  locale: en
  font: false
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Quick Start: index.md
  - Conventions used in this guide: conventions.md
  - District Administrator responsibilities: responsibilities.md
  - Edit locks and safe agenda editing: edit-locks.md
  - Administration access: administration.md
  - Find missing content or agendas: content.md
  - People and users: people.md
  - Add and edit users: user-accounts.md
  - Roles and access: roles.md
  - Groups: groups.md
  - Group memberships: memberships.md
  - Block and restore access: block-access.md
  - Security policies: security-policies.md
  - Safety and troubleshooting: safety-help.md
  - Review notes: reference.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-3

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

copyright: schoolboard.net District Administrator Guide — Version 1.1.004 Review Edition
